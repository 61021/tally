minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade

# semver@6.3.1 is the provenance-less 2023 backport behind @babel/core; tarball verified against the registry in loto-app on 2026-08-31.
trustPolicyExclude:
  - semver@6.3.1

shellEmulator: true

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: true
  workerd: true
